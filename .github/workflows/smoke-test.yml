name: Smoke Test (temporary)

# One-off verification that ffmpeg-static and Google TTS connectivity work
# on GitHub's actual Ubuntu runners - every previous test in this project
# ran on the developer's Windows machine, so Linux was never exercised.
# Delete this workflow and scripts/smoke-test.mjs once confirmed passing.
on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Run smoke test
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node scripts/smoke-test.mjs
