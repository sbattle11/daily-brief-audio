name: Daily Brief Audio

# Runs every 15 minutes, ALL DAY (not scoped to any UTC hour range) -
# run.mjs self-gates on the actual work via isTargetWindow() (checks real
# America/New_York local time), so "Eastern time, pinned year-round"
# survives the DST transition automatically with zero maintenance, instead
# of drifting an hour twice a year like a fixed-UTC cron window would.
# Every run outside the target window exits almost immediately (a few
# seconds), so running all day costs nothing meaningful.
#
# Changed from hourly (at :45) to every 15 minutes on 2026-08-28, after the
# same silent-skip failure mode recurred yet again (2026-08-27, 2026-08-28,
# on top of 2026-08-23/24 which is why the window was widened to 4am-8am ET
# in the first place) - confirmed via the GitHub Actions API that these are
# genuinely zero attempted runs, not failures, with the workflow's own
# state/concurrency/quota all checked and ruled out as a cause. This is
# GitHub's own scheduler dropping ticks. A 15-minute cadence means a
# dropped tick has 15-minute-wide neighbors instead of hour-wide ones,
# meaningfully improving the odds at least one lands. The target window
# itself (see TARGET_START/END_MINUTES_ET in run.mjs) now starts at 4:45am
# ET instead of 4:00am, matching real observed publish time (~4:40-4:41am
# ET) - purely to skip pointless early no-op ticks, not a reliability
# change.
on:
  # PAUSED 2026-08-30 at the user's request, pending a Google Cloud
  # billing/quota review (a "your account will be suspended" notification
  # came in - unclear yet whether that's the always-free per-API character
  # quota or the separate $300/90-day trial credit running out, which would
  # need a different fix). Scheduled runs are fully disabled; manual
  # workflow_dispatch still works below if a specific post needs
  # processing while this is paused. To resume: uncomment the schedule
  # block below and push.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the target-hour time gate and process any new Daily Briefs right now (for manual testing)"
        type: boolean
        default: false

# Needed to commit the updated manifest.json back to the repo after a
# real run processes a new Daily Brief - without this the default
# GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Run Daily Brief audio pipeline
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
        run: node scripts/run.mjs

      # Publishes the manifest so the eir theme's DAILY_BRIEF_MANIFEST_URL
      # (a raw.githubusercontent.com link, see project notes) reflects any
      # newly-narrated post from this run. processed-state.json travels
      # alongside it - it's what run.mjs actually checks to decide a post is
      # already done (keyed on published_at, not just post id - see
      # manifest.mjs), so it has to survive between ephemeral runs same as
      # manifest.json does. chapters.json added 2026-08-29 (chapter-
      # navigation feature) - the theme derives its URL from
      # DAILY_BRIEF_MANIFEST_URL itself (swaps the filename client-side), so
      # nothing else here needs to change for it to be reachable once
      # pushed. A no-op, harmless commit is avoided by only committing when
      # something actually changed.
      #
      # REAL BUG, hit in production 2026-08-29 (first tick after chapters.json
      # was introduced): `git add` treats ANY nonexistent pathspec as fatal
      # for the WHOLE command ("fatal: pathspec 'chapters.json' did not match
      # any files", exit 128) - confirmed locally before this fix. Since
      # chapters.json is only ever created on disk the first time
      # processPost() actually runs (never by this workflow file itself), it
      # doesn't exist yet in a fresh checkout until that happens, which broke
      # EVERY run outside the target window (i.e. the vast majority of the
      # day's ticks) even though there was nothing to commit either way.
      # Fixed by adding it separately, tolerating its absence - manifest.json
      # and processed-state.json are committed to the repo already and will
      # always exist, so they don't need the same guard.
      - name: Commit updated manifest.json, chapters.json, and processed-state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json processed-state.json
          if [ -f chapters.json ]; then git add chapters.json; fi
          git diff --cached --quiet || git commit -m "Update manifest.json / chapters.json / processed-state.json [skip ci]"
          git push
