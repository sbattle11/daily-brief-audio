name: Daily Brief Audio

# Runs every 15 minutes, ALL DAY (not scoped to any UTC hour range). There
# used to ALSO be a time-of-day gate in run.mjs (only do real work inside a
# 4:45am-8am ET window, exit instantly otherwise) - see run.mjs's own
# extensive history comment for the full chain of incidents - REMOVED
# 2026-09-30 after it caused a THIRD recurrence of the same root cause
# (GitHub's own cron scheduler firing this far less often than every 15
# minutes - confirmed via the Actions API as real ticks landing roughly
# 5-6 HOURS apart on some days, bracketing the narrow window on both sides
# without ever landing inside it, on 2026-09-27 and again on 2026-09-30).
# The window was only ever a "skip pointless early no-op ticks"
# optimization, never a correctness requirement (run.mjs's own per-post
# idempotency check already makes an off-hours run cheap and harmless),
# and this is a public repo so the extra runs cost nothing. Every tick
# that actually fires now does real work immediately, at whatever hour
# that happens to be - a Daily Brief narrated a few hours late once in a
# while is a minor inconvenience; a day with no audio at all, which the
# window was actually causing, is not.
on:
  # RESUMED 2026-09-08 - back on ahead of eir's actual go-live, to test the
  # Alnilam voice end-to-end (see project notes: paused 2026-09-04 after
  # voice testing settled on Alnilam, held pending this resumption).
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button from the Actions tab - no inputs needed now that there's no time gate to bypass

# Needed to commit the updated manifest.json back to the repo after a
# real run processes a new Daily Brief - without this the default
# GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Run Daily Brief audio pipeline
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node scripts/run.mjs

      # Publishes the manifest so the eir theme's DAILY_BRIEF_MANIFEST_URL
      # (a raw.githubusercontent.com link, see project notes) reflects any
      # newly-narrated post from this run. processed-state.json travels
      # alongside it - it's what run.mjs actually checks to decide a post is
      # already done (keyed on published_at, not just post id - see
      # manifest.mjs), so it has to survive between ephemeral runs same as
      # manifest.json does. chapters.json added 2026-08-29 (chapter-
      # navigation feature) - the theme derives its URL from
      # DAILY_BRIEF_MANIFEST_URL itself (swaps the filename client-side), so
      # nothing else here needs to change for it to be reachable once
      # pushed. A no-op, harmless commit is avoided by only committing when
      # something actually changed.
      #
      # REAL BUG, hit in production 2026-08-29 (first tick after chapters.json
      # was introduced): `git add` treats ANY nonexistent pathspec as fatal
      # for the WHOLE command ("fatal: pathspec 'chapters.json' did not match
      # any files", exit 128) - confirmed locally before this fix. Since
      # chapters.json is only ever created on disk the first time
      # processPost() actually runs (never by this workflow file itself), it
      # doesn't exist yet in a fresh checkout until that happens, which broke
      # EVERY run outside the target window (i.e. the vast majority of the
      # day's ticks) even though there was nothing to commit either way.
      # Fixed by adding it separately, tolerating its absence - manifest.json
      # and processed-state.json are committed to the repo already and will
      # always exist, so they don't need the same guard.
      #
      # Retry-with-rebase on push (added 2026-09-30, alongside removing the
      # time-of-day gate above): with every tick now doing real work
      # immediately instead of only a narrow morning window, two ticks can
      # plausibly overlap right after a new post publishes - both would see
      # it as new (neither has the other's commit yet), both do the real
      # work, but only the first to push wins; a bare `git push` would just
      # fail for the loser, leaving its already-uploaded audio with no
      # manifest entry (the same mismatch a manual re-run hit once before).
      # A few rebase-and-retry attempts let the loser catch up and commit
      # its own result instead of losing it outright.
      - name: Commit updated manifest.json, chapters.json, and processed-state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json processed-state.json
          if [ -f chapters.json ]; then git add chapters.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update manifest.json / chapters.json / processed-state.json [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - fetching and rebasing before retrying."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
