name: Daily Brief Audio

# Runs HOURLY, not once a day - run.mjs self-gates on the actual work via
# isTargetHour() (checks real America/New_York local time), so "Eastern
# time, pinned year-round" survives the DST transition automatically with
# zero maintenance, instead of drifting an hour twice a year like a
# fixed-UTC cron would. Every run outside the target window exits almost
# immediately.
#
# Cron fires at :45 past every hour (not :00), landing close to shortly
# after each hour - Daily Briefs publish ~4:40-4:41am ET, so a trigger
# landing in the 4am-8am ET window (see TARGET_HOUR_START/END_ET in
# run.mjs) picks it up. That window is intentionally several hours wide,
# not just the single hour after publish: GitHub Actions' documented
# scheduling jitter on cron triggers is large enough that it was observed
# (2026-08-23 and 2026-08-24) hopping clean over a single-hour window two
# mornings in a row, silently delaying pickup with no run ever attempting
# the work. A wide window costs nothing extra since the manifest already
# makes reprocessing idempotent - a run that finds nothing new just exits.
on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Bypass the target-hour time gate and process any new Daily Briefs right now (for manual testing)"
        type: boolean
        default: false

# Needed to commit the updated manifest.json back to the repo after a
# real run processes a new Daily Brief - without this the default
# GITHUB_TOKEN is read-only.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Run Daily Brief audio pipeline
        env:
          GHOST_API_URL: ${{ secrets.GHOST_API_URL }}
          GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
        run: node scripts/run.mjs

      # Publishes the manifest so the eir theme's DAILY_BRIEF_MANIFEST_URL
      # (a raw.githubusercontent.com link, see project notes) reflects any
      # newly-narrated post from this run. A no-op, harmless commit is
      # avoided by only committing when manifest.json actually changed.
      - name: Commit updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Update manifest.json [skip ci]"
          git push
